<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup C · Zlatni ljiljani</title>
<link rel="stylesheet" href="../../vendor/fonts/fonts.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --gold: #d4af5a; --gold-l: #f1dc9e; --gold-d: #8f6a22; --bg: #0b0d0c; --fg: #f6f4ee; --soft: rgba(246,244,238,.8); --muted: rgba(246,244,238,.55);
    --serif: "EB Garamond", Georgia, serif; --sans: Inter, system-ui, sans-serif; --gutter: clamp(16px, 5vw, 80px); }
  html { background: var(--bg); }
  body { background: var(--bg); color: var(--fg); font-family: var(--sans); line-height: 1.6; overflow-x: clip; }
  .lily { display: block; width: 100%; height: auto; overflow: visible; }

  .top { padding: clamp(88px, 14svh, 150px) var(--gutter) clamp(28px, 5svh, 48px); text-align: center;
    background: radial-gradient(ellipse 60% 70% at 50% 0%, rgba(212,175,90,.18), rgba(212,175,90,0) 70%); }
  .eyebrow { font-size: .72rem; letter-spacing: .24em; text-transform: uppercase; color: var(--gold); }
  h1 { margin-top: .8rem; font-family: var(--serif); font-weight: 400; line-height: .95; font-size: clamp(2.6rem, 8vw, 5.6rem);
    background: linear-gradient(100deg, #a98034 0%, #f1dc9e 25%, #d4af5a 40%, #fff4d2 50%, #d4af5a 60%, #a98034 100%); background-size: 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 7s ease-in-out infinite; }
  @keyframes shine { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
  .lead { margin: 1rem auto 0; max-width: 34rem; color: var(--soft); }
  .sub { margin-top: .4rem; font-family: var(--serif); font-style: italic; font-size: 1.25rem; color: var(--gold-l); }

  /* seven panels: one opens wide, the others stay as narrow gilded columns */
  .panels { display: flex; flex-direction: column; gap: 8px; padding: 0 var(--gutter); max-width: 1500px; margin: 0 auto; }
  .pn { position: relative; overflow: hidden; border-radius: 10px; border: 1px solid rgba(212,175,90,.28);
    background: linear-gradient(180deg, #1b1f1c, #101211); transition: flex-grow .7s cubic-bezier(.2,.7,.2,1), border-color .4s ease, background .4s ease; }
  .pn::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s ease;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(212,175,90,.22), rgba(212,175,90,0) 70%); }
  .pn.open { border-color: rgba(212,175,90,.7); }
  .pn.open::before { opacity: 1; }
  .pn-btn { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 14px; width: 100%; min-height: 72px; padding: 12px 16px; cursor: pointer; }
  .pn-btn:focus-visible { outline: 1px solid var(--gold); outline-offset: -4px; }
  .pn-lily { flex: none; width: 30px; transition: transform .6s ease, filter .6s ease; filter: grayscale(.6) brightness(.8); }
  .pn.open .pn-lily { filter: drop-shadow(0 0 18px rgba(212,175,90,.6)); }
  .pn-rom { font-family: var(--serif); font-style: italic; color: var(--gold); font-size: 1.05rem; min-width: 2.2ch; }
  .pn-name { font-family: var(--serif); font-size: 1.45rem; line-height: 1.05; flex: 1; }
  .pn-year { font-family: var(--serif); color: var(--gold); font-size: 1.05rem; font-variant-numeric: lining-nums; }
  .pn-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .6s cubic-bezier(.2,.7,.2,1); }
  .pn.open .pn-body { grid-template-rows: 1fr; }
  .pn-body > div { min-height: 0; overflow: hidden; }
  .pn-in { padding: 4px 18px 24px 60px; }
  .post { display: inline-block; padding: .25rem .7rem; border: 1px solid rgba(212,175,90,.6); border-radius: 999px; font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-l); margin-bottom: 1rem; }
  .pn dl { display: grid; gap: 12px; }
  .pn dt { font-size: .62rem; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
  .pn dd { color: var(--soft); }
  .pn .note { margin-top: 1rem; font-family: var(--serif); font-style: italic; font-size: 1.2rem; line-height: 1.4; max-width: 28rem; }
  .big-name { display: none; }

  @media (min-width: 900px) {
    .panels { flex-direction: row; height: min(78svh, 720px); gap: 10px; }
    .pn { flex: 1 1 0; min-width: 0; }
    .pn.open { flex-grow: 6; }
    .pn-btn { position: absolute; inset: 0; flex-direction: column; justify-content: flex-start; padding: 28px 0; gap: 18px; z-index: 2; }
    .pn.open .pn-btn { pointer-events: none; }
    .pn-lily { width: clamp(30px, 2.6vw, 42px); }
    .pn-name { writing-mode: vertical-rl; transform: rotate(180deg); font-size: clamp(1.3rem, 1.7vw, 1.8rem); white-space: nowrap; flex: none; margin-top: auto; transition: opacity .3s ease; }
    .pn-year { transition: opacity .3s ease; }
    .pn.open .pn-name, .pn.open .pn-year, .pn.open .pn-rom { opacity: 0; }
    .pn-body { position: absolute; inset: 0; display: block; opacity: 0; transition: opacity .5s ease; pointer-events: none; }
    .pn.open .pn-body { opacity: 1; transition-delay: .3s; pointer-events: auto; }
    .pn-body > div { height: 100%; overflow: visible; }
    .pn-in { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: clamp(28px, 3vw, 48px); min-width: 30rem; }
    .pn-in .lily { width: 64px; margin-bottom: auto; filter: drop-shadow(0 0 24px rgba(212,175,90,.5)); }
    .big-name { display: block; font-family: var(--serif); font-weight: 400; font-size: clamp(2.6rem, 4.4vw, 4.4rem); line-height: .95; margin-bottom: 1.4rem; }
    .big-name small { display: block; font-size: .4em; color: var(--gold); margin-bottom: .4rem; font-style: italic; }
    .pn dl { grid-template-columns: repeat(2, max-content); gap: 12px 40px; }
    .pn-big-year { position: absolute; right: 24px; top: 6px; font-family: var(--serif); font-size: clamp(6rem, 11vw, 11rem); line-height: 1; color: transparent; -webkit-text-stroke: 1px rgba(212,175,90,.3); }
  }
  @media (max-width: 899px) { .pn-in .lily, .pn-big-year { display: none; } }
  @media (hover: hover) { .pn:not(.open):hover { border-color: rgba(212,175,90,.55); background: linear-gradient(180deg, #232823, #121413); } }

  .foot { text-align: center; padding: 30px var(--gutter) 140px; font-size: .8rem; color: var(--muted); }
  .foot a { color: var(--gold-l); }
  .btn { display: inline-flex; align-items: center; min-height: 46px; margin-top: 1.2rem; padding: 0 1.3rem; border: 1px solid rgba(212,175,90,.55); border-radius: 999px; color: var(--gold-l) !important; text-decoration: none; font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <header class="top">
    <p class="eyebrow">Najviše ratno priznanje</p>
    <h1>Zlatni ljiljani Sanskog Mosta</h1>
    <p class="lead">Zlatni ljiljan je najviše ratno priznanje Armije Republike Bosne i Hercegovine iz rata od 1992. do 1995.</p>
    <p class="sub">Ljiljan je hiljadu godina simbol Bosne.</p>
  </header>

  <main class="panels" id="panels"></main>

  <p class="foot"><span id="count"></span> <a id="src" target="_blank" rel="noopener">Izvor: Wikipedia</a><br>
    <a class="btn" href="../../hodnik">Ličnosti Sanskog Mosta →</a></p>

<script src="../../js/data/licnosti-data.js"></script>
<script src="zlj-common.js"></script>
<script>
  const Z = window.ZLJILJANI, ROM = ['I','II','III','IV','V','VI','VII','VIII','IX'];
  count.textContent = Z.length + ' dobitnika.'; src.href = window.ZLJILJANI_SRC;
  panels.innerHTML = Z.map((z, i) => `<section class="pn${i === 0 ? ' open' : ''}" id="${z.id}">
    <button class="pn-btn" type="button" aria-expanded="${i === 0}">
      <span class="pn-lily">${ZLJ_LILY('l' + i)}</span>
      <span class="pn-rom">${ROM[i]}</span>
      <span class="pn-name">${z.name}</span>
      <span class="pn-year">${z.year}</span>
    </button>
    <div class="pn-body"><div><div class="pn-in">
      ${ZLJ_LILY('b' + i)}
      <span class="pn-big-year" aria-hidden="true">${z.year}</span>
      <h2 class="big-name"><small>${ROM[i]} · ${z.year}</small>${z.name}</h2>
      ${z.post ? '<span class="post">Posthumno</span>' : ''}
      <dl><div><dt>Rođenje</dt><dd>${z.born.bs}</dd></div><div><dt>Jedinica</dt><dd>${z.unit.bs}</dd></div></dl>
      ${z.note ? `<p class="note">${z.note.bs}</p>` : ''}
    </div></div></div>
  </section>`).join('');
  const pns = [...panels.children];
  const open = p => pns.forEach(q => { const on = q === p; q.classList.toggle('open', on); q.querySelector('.pn-btn').setAttribute('aria-expanded', on); });
  panels.addEventListener('click', e => { const b = e.target.closest('.pn-btn'); if (b) open(b.parentElement); });
  // desktop: hovering a column opens it too
  if (matchMedia('(hover: hover) and (min-width: 900px)').matches)
    pns.forEach(p => p.addEventListener('mouseenter', () => open(p)));
</script>
</body>
</html>

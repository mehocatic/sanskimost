<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sanski Most</title>
  <meta name="description" content="Places around Sanski Most, Bosnia and Herzegovina.">
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <script src="lib.js"></script>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="place.css">
</head>
<body class="on-deep place-page">

  <nav class="site-nav" aria-label="Main" data-i18n-attr="aria-label:nav.label">
    <a href="index.html" data-i18n="nav.home">Home</a>
    <a href="explore.html" data-i18n="nav.explore">Explore</a>
  </nav>

  <a class="back" id="back" href="index.html#places"><span aria-hidden="true">&larr;</span> <span class="back-label" data-i18n="place.back">All places</span></a>

  <main>
    <section class="place-hero">
      <div class="place-img" id="place-img"></div>
      <div class="place-title">
        <p class="eyebrow">Sanski Most</p>
        <h1 id="place-title"></h1>
      </div>
    </section>

    <section class="place-body on-paper">
      <div class="place-text">
        <p class="detail-long" id="place-long"></p>
        <p class="detail-note" id="place-note"></p>
        <div class="detail-see" id="place-see" hidden>
          <h2 data-i18n="place.see">Also worth seeing</h2>
          <ul id="place-see-list"></ul>
        </div>
      </div>
      <div class="detail-gallery" id="gallery"></div>
    </section>

    <nav class="place-pager" aria-label="Other places" data-i18n-attr="aria-label:place.others">
      <a class="pager-link prev" id="pager-prev" href="#"><span class="pl" data-i18n="place.prev">Previous place</span><span class="pn"></span></a>
      <a class="pager-link next" id="pager-next" href="#"><span class="pl" data-i18n="place.next">Next place</span><span class="pn"></span></a>
    </nav>
  </main>

  <div id="lightbox" class="on-deep" role="dialog" aria-modal="true" aria-label="Photo viewer" data-i18n-attr="aria-label:lb.label" hidden>
    <button class="lb-btn lb-close" id="lb-close" type="button" aria-label="Close photo" data-i18n-attr="aria-label:lb.close.aria"><span data-i18n="lb.close">Close</span> <span class="esc">Esc</span></button>
    <button class="lb-btn lb-prev" id="lb-prev" type="button" aria-label="Previous photo" data-i18n-attr="aria-label:lb.prev">&larr;</button>
    <img id="lb-img" alt="">
    <button class="lb-btn lb-next" id="lb-next" type="button" aria-label="Next photo" data-i18n-attr="aria-label:lb.next">&rarr;</button>
    <p class="lb-count" id="lb-count"></p>
    <p class="lb-credit" id="lb-credit" hidden></p>
  </div>

  <script src="places.js"></script>
  <script src="i18n/en.js"></script>
  <script src="i18n/bs.js"></script>
  <script src="i18n.js"></script>
  <script src="place.js"></script>
  <script src="nav.js"></script>
</body>
</html>

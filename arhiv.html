<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="arh.doctitle">Arhiv &middot; Sanski Most</title>
  <meta name="description" data-i18n-attr="content:arh.meta" content="Stare fotografije Sanskog Mosta od 1900. do 2014, kroz vrijeme i na karti.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sanski Most">
  <meta property="og:title" data-i18n-attr="content:arh.doctitle" content="Arhiv · Sanski Most">
  <meta property="og:description" data-i18n-attr="content:arh.meta" content="Stare fotografije Sanskog Mosta od 1900. do 2014, kroz vrijeme i na karti.">
  <meta property="og:url" content="https://visitsanskimost.netlify.app/arhiv">
  <meta property="og:image" content="https://visitsanskimost.netlify.app/photos/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="bs_BA">
  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://visitsanskimost.netlify.app/photos/og.jpg">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="arhiv.css">
</head>
<body id="top" class="on-deep arhiv-page">

  <nav class="site-nav" aria-label="Main" data-i18n-attr="aria-label:nav.label">
    <a class="nav-logo" href="./">Sanski Most</a>
    <div class="nav-links" id="nav-links">
      <a class="nav-home" href="./" data-i18n="nav.home">Početna</a>
      <a href="explore" data-i18n="nav.explore">Istraži</a>
      <a href="historija" data-i18n="nav.history">Historija</a>
      <a href="arhiv" aria-current="page" data-i18n="nav.archive">Arhiv</a>
      <a href="pogodi" data-i18n="nav.quiz">Kviz</a>
      <a href="plan" data-i18n="nav.plan">Posjeta</a>
    </div>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links"><span class="t-open" data-i18n="nav.menu">Meni</span><span class="t-close" data-i18n="nav.close">Zatvori</span></button>
  </nav>

  <main id="arh">
    <header class="arh-head">
      <p class="eyebrow"><span data-i18n="arh.eyebrow">Arhiv · 1900 do 2014</span> · <span id="count" aria-live="polite"></span></p>
      <h1 data-i18n-html="arh.title.html">Grad u devedeset i jednoj <em>fotografiji</em></h1>
    </header>

    <div class="arh-tools">
      <div class="arh-toggle" role="group" aria-label="Prikaz" data-i18n-attr="aria-label:arh.view">
        <button type="button" data-view="time" aria-pressed="true" data-i18n="arh.view.time">Kroz vrijeme</button>
        <button type="button" data-view="map" aria-pressed="false" data-i18n="arh.view.map">Na karti</button>
      </div>
      <div class="arh-chips" id="chips" role="group" aria-label="Tema" data-i18n-attr="aria-label:arh.filter"></div>
    </div>

    <!-- 1. Through time: the Sana as a time line. Wide screens scroll it sideways, phones downwards. Filled by arhiv.js -->
    <section id="v-time" aria-label="Kroz vrijeme" data-i18n-attr="aria-label:arh.view.time">
      <div class="rail" id="rail">
        <div class="stage" id="stage">
          <div class="strip" id="strip"></div>
        </div>
      </div>
      <div class="scrub" id="scrub">
        <div class="bars" id="bars" aria-hidden="true"></div>
        <i class="needle" id="needle" aria-hidden="true"><b id="needle-y"></b></i>
        <div class="ticks" aria-hidden="true"></div>
      </div>
    </section>

    <!-- 2. On the map: the same photographs by the place they show, with a year dial -->
    <section id="v-map" hidden aria-label="Na karti" data-i18n-attr="aria-label:arh.view.map">
      <div id="amap" role="region" aria-label="Karta starih fotografija" data-i18n-attr="aria-label:arh.map"></div>
      <aside class="pcard" id="pcard" hidden></aside>
      <div class="dial">
        <p class="dial-now"><button type="button" class="play" id="play" aria-label="Pusti vrijeme" data-i18n-attr="aria-label:arh.play"></button><b id="dial-y">2014</b><span id="dial-info"></span></p>
        <input type="range" id="dial" min="1900" max="2014" step="1" value="2014" aria-label="Godina" data-i18n-attr="aria-label:arh.year">
        <div class="ticks" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <footer class="site-foot on-deep">
    <div class="sf-brand">
      <p class="foot-name">Sanski Most</p>
      <p class="sf-country" data-i18n="footer.country">Bosna i Hercegovina</p>
    </div>
    <nav class="sf-links" aria-label="Stranice" data-i18n-attr="aria-label:footer.pages">
      <a href="./" data-i18n="nav.home">Početna</a>
      <a href="explore" data-i18n="nav.explore">Istraži</a>
      <a href="historija" data-i18n="nav.history">Historija</a>
      <a href="arhiv" data-i18n="nav.archive">Arhiv</a>
      <a href="pogodi" data-i18n="nav.quiz">Kviz</a>
      <a href="plan" data-i18n="nav.plan">Posjeta</a>
    </nav>
    <div class="sf-base">
      <p class="sf-credit"><span data-i18n="footer.credit">Dizajn i izrada</span> <a href="https://www.mehocatic.com" rel="noopener" target="_blank">Meho Ćatić <span class="sf-url">mehocatic.com ↗</span></a></p>
      <a href="#top" class="foot-top" data-i18n="footer.top">Na vrh</a>
    </div>
  </footer>

  <!-- one photograph, opened -->
  <dialog id="lb" aria-label="Fotografija" data-i18n-attr="aria-label:arh.photo">
    <button type="button" class="lb-x" id="lb-x"><span data-i18n="arh.close">Zatvori</span> ✕</button>
    <div class="lb-ph"><img id="lb-img" alt=""></div>
    <div class="lb-txt">
      <p class="lb-y" id="lb-y"></p>
      <h2 id="lb-cap"></h2>
      <dl id="lb-meta"></dl>
      <div class="lb-act">
        <button type="button" class="btn" id="lb-map" data-i18n="arh.onmap">Pokaži na karti →</button>
        <button type="button" class="btn ghost" id="lb-share" data-i18n="arh.share">Podijeli</button>
      </div>
      <div class="lb-same" id="lb-same" hidden><p data-i18n="arh.same">Isto mjesto, druge godine</p><div id="lb-same-list"></div></div>
    </div>
    <div class="lb-nav">
      <button type="button" id="lb-prev">← <span data-i18n="arh.prev">Prethodna</span></button>
      <span id="lb-n"></span>
      <button type="button" id="lb-next"><span data-i18n="arh.next">Sljedeća</span> →</button>
    </div>
  </dialog>

  <script defer src="vendor/leaflet/leaflet.js"></script>
  <script defer src="arhiv-data.js"></script>
  <script defer src="i18n/en.js"></script>
  <script defer src="i18n/bs.js"></script>
  <script defer src="i18n.js"></script>
  <script defer src="arhiv.js"></script>
  <script defer src="nav.js"></script>
</body>
</html>

# Statički sajt. Pri objavi se priprema samo javna konfiguracija kviza.
[build]
  publish = "."
  command = "node tools/quiz-config.mjs"
  # Netlify preskače build (exit 0) osim ako poruka zadnjeg commita sadrži [deploy].
  # Tako obični pushevi ne troše kredite; objava se radi namjerno.
  ignore = "git log -1 --pretty=%B | grep -qi '\\[deploy\\]' && exit 1 || exit 0"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Frejmovi i vendor se mijenjaju samo novim folderom (frames-v3 ...), pa je dug keš siguran.
[[headers]]
  for = "/frames-v2/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/frames-m-v2/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

# Radni dokumenti, skripte i upute za Claudea su u gitu, ali nisu dio sajta.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

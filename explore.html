<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="explore.doctitle">Explore &middot; Sanski Most</title>
  <meta name="description" data-i18n-attr="content:explore.meta" content="Map of the places around Sanski Most, Bosnia and Herzegovina.">
  <!-- TODO(verify): the domain is not known yet. Replace https://TODO-domain.example in og:url, og:image and twitter:image (also in robots.txt and sitemap.xml). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sanski Most">
  <meta property="og:title" data-i18n-attr="content:explore.doctitle" content="Istraži · Sanski Most">
  <meta property="og:description" data-i18n-attr="content:explore.meta" content="Karta mjesta u Sanskom Mostu i okolini, Bosna i Hercegovina.">
  <meta property="og:url" content="https://TODO-domain.example/explore">
  <meta property="og:image" content="https://TODO-domain.example/photos/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="bs_BA">
  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://TODO-domain.example/photos/og.jpg">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/fonts/fonts.css">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="vendor/leaflet/MarkerCluster.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="explore.css">
</head>
<body class="on-deep explore-page">

  <nav class="site-nav" aria-label="Main" data-i18n-attr="aria-label:nav.label">
    <a href="./" data-i18n="nav.home">Home</a>
    <a href="explore" aria-current="page" data-i18n="nav.explore">Explore</a>
  </nav>

  <header class="explore-head">
    <p class="eyebrow" data-i18n="explore.eyebrow">Explore</p>
    <h1 data-i18n="explore.title">Places on the map</h1>
  </header>

  <!-- filled by explore.js: category filters, or the route being shown (?route=<id>) -->
  <div class="explore-bar">
    <div class="filters" id="filters" role="group" aria-label="Filter the map by category" data-i18n-attr="aria-label:explore.filter"></div>
    <div class="route-bar" id="route-bar" hidden></div>
  </div>

  <div class="explore-main">
    <div id="map" role="region" aria-label="Map of places around Sanski Most" data-i18n-attr="aria-label:explore.map"></div>
    <aside class="poi-list" aria-labelledby="poi-list-title">
      <h2 id="poi-list-title"><span data-i18n="explore.list">On the map</span> <span class="poi-count" id="poi-count"></span></h2>
      <p class="route-missing" id="route-missing" hidden></p>
      <ol class="poi-items" id="poi-items"></ol>
    </aside>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/leaflet/leaflet.markercluster.js"></script>
  <script src="places.js"></script>
  <script src="routes.js"></script>
  <script src="poi.js"></script>
  <script src="i18n/en.js"></script>
  <script src="i18n/bs.js"></script>
  <script src="i18n.js"></script>
  <script src="explore.js"></script>
  <script src="nav.js"></script>
</body>
</html>
